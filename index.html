async function all(){if(!currentUser)return recordCache;const result=await Promise.race([sb.from('responses').select('*').order('created_at',{ascending:false}),new Promise(resolve=>setTimeout(()=>resolve({data:null,error:null,timedOut:true}),5000))]);if(result.timedOut){console.warn('Cloud records timed out; keeping cached history.');return recordCache}if(result.error){console.warn('Cloud records unavailable; keeping cached history.',result.error);return recordCache}recordCache=(result.data||[]).map(x=>({id:x.id,questionId:x.question_id,createdAt:new Date(x.created_at).getTime(),audioUrl:'',audioPath:x.audio_path,duration:x.audio_duration,mastery:x.mastery,technical:x.technical_self_rating,english:x.english_self_rating,transcript:x.transcript||'',analysis:x.speech_analysis||null,comment:x.teacher_comment,teacherMastery:x.teacher_mastery,retry:x.retry_required}));return recordCache}async function hydrateAudio(records){return Promise.all(records.map(async x=>{if(!x.audioPath)return x;if(x.audioUrl)return x;const signedResult=await Promise.race([sb.storage.from('recordings').createSignedUrl(x.audioPath,3600),new Promise(resolve=>setTimeout(()=>resolve({data:null}),3500))]);return{...x,audioUrl:signedResult.data?.signedUrl||''}}))}async function put(x){const{error}=await sb.from('responses').update({teacher_comment:x.comment,teacher_mastery:x.teacherMastery,retry_required:x.retry}).eq('id',x.id);if(error)throw error}

async function addQuestion(){const question=document.querySelector('#newQuestion').value.trim(),category=document.querySelector('#newCategory').value.trim()||'Technical',newTopic=document.querySelector('#newTopic').value.trim()||'General';if(!question){alert('請輸入英文題目。');return}const row={id:crypto.randomUUID(),user_id:currentUser.id,category,topic:newTopic,question,sort_order:Math.max(-1,...Q.map(q=>q.sortOrder))+1};const{error}=await sb.from('questions').insert(row);if(error){alert('新增失敗：'+error.message);return}await loadQuestions();home()}

function stats(q,records){const a=records.filter(x=>x.questionId===q.id).sort((a,b)=>b.createdAt-a.createdAt),last=a[0];return {...q,attempts:a.length,mastery:last?.mastery||0,last:last?.createdAt||0,retry:a.some(x=>x.retry)}}
async function home(){selected=null;app.innerHTML='<div class="wrap"><div class="empty" style="margin-top:40px">正在讀取雲端紀錄…</div></div>';try{const records=await all(),qs=Q.map(q=>stats(q,records)),filtered=qs.filter(q=>(cat==='全部'||q.category===cat)&&(topic==='全部'||q.topic===topic)&&(mastery==='全部'||q.mastery==mastery)).sort((a,b)=>b.retry-a.retry||a.mastery-b.mastery);app.innerHTML=`<div class="wrap"><section class="hero"><small>${role==='student'?'今天的練習':'Teacher View'}</small><h2>${role==='student'?'Speak clearly.<br>Think like an engineer.':'Listen. Guide.<br>Build confidence.'}</h2><p>${role==='student'?'選一題，開口練習 1–2 分鐘。':'查看錄音、留言並指定重新練習。'}</p></section><div class="filters">${['全部','HR','Experience','Technical'].map(x=>`<button class="chip ${cat===x?'on':''}" data-cat="${x}">${x==='Experience'?'經驗':x}</button>`).join('')}</div><div class="filters">${['全部','Transformer','Protection','Electrical Safety','Safety'].map(x=>`<button class="chip ${topic===x?'on':''}" data-topic="${x}">${x}</button>`).join('')}</div><select id="mastery"><option value="全部">全部熟練度</option>${M.map((x,i)=>`<option value="${i}" ${mastery==i?'selected':''}>${i} · ${x}</option>`).join('')}</select><div class="section-head"><div class="eyebrow">Question bank · ${filtered.length}</div><h2>${role==='student'?'優先練習':'學生題庫'}</h2></div><div class="grid">${filtered.map(q=>`<article class="card ${q.retry?'retry':''}">${q.retry?'<span class="retry-tag">★ 老師建議重新練習</span>':''}<p class="topic">⚡ ${q.topic}</p><h3 class="question">${q.question}</h3><div class="meta"><span>${M[q.mastery]}</span><span>🎙 ${q.attempts} 次</span><span>${date(q.last)}</span></div><div class="bars">${[1,2,3,4].map(n=>`<i class="${n<=q.mastery?'fill':''}"></i>`).join('')}</div><button class="primary" data-open="${q.id}">${role==='teacher'?'查看回答':'去練習'} →</button></article>`).join('')}</div></div>`;bindHome()}catch(e){console.error(e);app.innerHTML='<div class="wrap"><div class="feedback" style="margin-top:30px"><b>無法讀取雲端資料</b><p>'+es function bindHome(){document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;home()});document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{topic=b.dataset.topic;home()});document.querySelector('#mastery').onchange=e=>{mastery=e.target.value;home()};document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openQ(b.dataset.open))}
async function openQ(id){speechAnalysis=null;analysisPending=false;selected=Q.find(q=>q.id===id);if(!selected){alert('找不到這個練習，請重新整理題庫。');return}app.innerHTML='<div class="wrap"><div class="empty" style="margin-top:40px">正在開啟練習…</div></div>';let records=[];try{records=(await all()).filter(x=>x.questionId===id).sort((a,b)=>b.createdAt-a.createdAt)}catch(e){console.warn('Response history unavailable',e)}attempts=await hydrateAudio(records);let query=sb.from('question_notes').select('content').eq('question_id',id);if(userRole==='student'&&currentUser)query=query.eq('user_id',currentUser.id);const noteResult=await Promise.race([query.limit(1).maybeSingle(),new Promise(resolve=>setTimeout(()=>resolve({data:null,timedOut:true}),3000))]);if(noteResult.timedOut)console.warn('Question note timed out; opening practice without it.');questionNote=noteResult.data?.content||'';noteVisible=false;renderPractice()}
function rating(title,key,max,labels){return `<div class="rating"><h3>${title}</h3><div class="options">${Array.from({length:max+1},(_,n)=>`<button data-rate="${key}" data-value="${n}" class="${ratings[key]===n?'on':''}"><b>${n}</b>${labels[n]}</button>`).join('')}</div></div>`}
function renderPractice(){app.innerHTML=`<div class="wrap"><button class="back" id="back">← 返回題庫</button><div class="eyebrow">⚡ ${selected.topic}</div><h2 class="practice-title">${selected.question}</h2>${role==='student'?`<section class="recorder"><div class="mic ${rec?'live':''}">🎙</div><div class="timer">${time(sec)}</div><small>${rec?'Recording…':'準備好就開始回答'}</small>${!rec&&!blob?'<button class="record-btn" id="start">開始錄音</button>':''}${rec?'<button class="record-btn stop" id="stop">停止錄音</button>':''}${blob?`<audio controls id="preview"></audio><button class="record-btn stop" id="redo">重新錄製</button>`:''}</section>`:''}${role==='student'&&blob?`<section class="panel">${rating('熟練度','mastery',4,['未練習','不熟','普通','熟練','Ready'])}${rating('Technical Knowledge · 專業內容我知道嗎？','technical',2,['不知道','部分知道','知道'])}${rating('English Expression · 我能用英文表達嗎？','english',2,['講不出來','講得卡','可以'])}<button class="primary" id="save">儲存這次回答</button></section>`:''}<div class="section-head"><h2>練習紀錄 · ${attempts.length}</h2></div>${attempts.length?attempts.map((a,i)=>attemptHTML(a,attempts.length-i)).join(''):'<div class="empty">還沒有回答，從第一次開口開始。</div>'}</div>`;bindPractice()}
function attemptHTML(a,n){return `<article class="attempt"><div class="attempt-top"><div><b>Attempt #${n}</b><div class="eyebrow" style="margin-top:5px">${date(a.createdAt)} · ${time(a.duration)}</div></div><span class="pill">熟練度 ${a.mastery}</span></div><audio controls src="${a.audioUrl}"></audio><div class="meta" style="justify-content:flex-start"><span>Technical ${a.technical}/2</span><span>English ${a.english}/2</span></div>${a.transcript?`<details style="margin-top:12px"><summary style="font-weight:800;cursor:pointer">Transcript</summary><div style="white-space:pre-wrap;margin-top:8px;color:var(--muted);font-size:13px">${esc(a.transcript)}</div></details>`:''}${a.comment&&role==='student'?`<div class="feedback"><b>老師回饋</b><p>${esc(a.comment)}</p>${a.retry?'<b>★ 建議重新練習</b>':''}</div>`:''}${role==='student'?`<button class="chip" data-delete="${a.id}" style="margin-top:14px;color:#b42318">刪除這次錄音</button>`:''}${role==='teacher'?`<div class="teacher-form"><textarea id="comment-${a.id}" placeholder="留下具體、可行的回饋…">${esc(a.comment)}</textarea><div class="teacher-row"><label>Teacher mastery <select id="tm-${a.id}">${[0,1,2,3,4].map(x=>`<option ${x==(a.teacherMastery??a.mastery)?'selected':''}>${x}</option>`).join('')}</select></label><label><input id="retry-${a.id}" type="checkbox" ${a.retry?'checked':''}> 建議重新練習</label><button data-feedback="${a.id}">儲存回饋</button></div></div>`:''}</article>`}
function enhancePractice(){const title=document.querySelector('.practice-title');if(!title)return;const panel=document.createElement('section');panel.className='panel';if(role==='student'){panel.innerHTML=`<button class="chip" id="toggleNote">${noteVisible?'隱藏我的講稿':'顯示我的講稿'}</button><div class="${noteVisible?'':'hidden'}" id="noteArea"><h3>我的回答講稿</h3><textarea id="scriptNote" placeholder="在這裡整理回答架構、關鍵字與完整講稿…">${esc(questionNote)}</textarea><button class="primary" id="saveNote">儲存講稿</button></div>`}else{panel.innerHTML=`<h3>Student's Answer Script</h3><div style="white-space:pre-wrap;color:var(--muted)">${esc(questionNote)||'No script has been added yet.'}</div>`}title.insertAdjacentElement('afterend',panel);const toggle=document.querySelector('#toggleNote');if(toggle)toggle.onclick=()=>{questionNote=document.querySelector('#scriptNote')?.value??questionNote;noteVisible=!noteVisible;renderPractice()};const saveNote=document.querySelector('#saveNote');if(saveNote)saveNote.onclick=async()=>{questionNote=document.querySelector('#scriptNote').value;const{error}=await sb.from('question_notes').upsert({user_id:currentUser.id,question_id:selected.id,content:questionNote,updated_at:new Date().toISOString()});if(error){alert('講稿儲存失敗：'+error.message);return}saveNote.textContent='已儲存 ✓'};if(rec){const live=document.createElement('div');live.id='liveTranscript';live.style='margin-top:14px;color:#c8d0dc;font-size:13px;text-align:left';live.textContent=transcriptDraft||'Live transcript will appear here…';document.querySelector('.recorder').appendChild(live)}if(blob&&role==='student'){const box=document.createElement('div');box.className='rating';box.innerHTML=`<h3>逐字稿（可手動修訂）</h3><textarea id="transcriptDraft" placeholder="Chrome 會嘗試在錄音時產生英文逐字稿；若未產生，可在這裡手動輸入。">${esc(transcriptDraft)}</textarea>`;document.querySelector('#save').parentElement.insertBefore(box,document.querySelector('#save').parentElement.firstChild);document.querySelector('#transcriptDraft').oninput=e=>transcriptDraf function createSimpleHomeMenu(){if(selected||document.querySelector('#teacherSnapshot')||document.querySelector('#vocabBack')||document.querySelector('#expressionBack')||document.querySelector('#componentBack'))return;const hero=document.querySelector('#app>.wrap>.hero'),head=document.querySelector('#app>.wrap>.section-head');if(!hero||!head)return;if(!document.querySelector('#simpleHomeStyle')){const style=document.createElement('style');style.id='simpleHomeStyle';style.textContent=`#homeToolbar,#guestNavigation{display:none!important}#simpleHomeMenu{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px;margin:14px 0 22px;box-shadow:0 8px 22px rgba(16,39,68,.06)}#simpleHomeMenu .chip{margin:0;flex:0 0 auto}#simpleHomeMenu .spacer{flex:1 1 auto}@media(max-width:700px){#simpleHomeMenu{flex-wrap:nowrap;overflow-x:auto;padding:8px}#simpleHomeMenu .spacer{display:none}#simpleHomeMenu .chip{font-size:12px;padding:8px 11px;white-space:nowrap}}`;document.head.appendChild(style)}let menu=document.querySelector('#simpleHomeMenu');if(!menu){menu=document.createElement('nav');menu.id='simpleHomeMenu';menu.innerHTML='<button class="chip" id="simpleVocabulary">我的單字</button><button class="chip" id="simpleExpressions">精準表達</button><button class="chip" id="simpleComponents">元件庫</button><span class="spacer"></span><button class="chip" id="simpleAddQuestion">＋ 新增題目</button><button class="chip" id="simpleFilters">⚙ 篩選題目</button>';hero.insertAdjacentElement('afterend',menu);menu.querySelector('#simpleVocabulary').onclick=()=>showVocabulary();menu.querySelector('#simpleExpressions').onclick=()=>showExpressionHome();menu.querySelector('#simpleComponents').onclick=()=>showComponentLibrary();menu.querySelector('#simpleAddQuestion').onclick=()=>{const manager=[...document.querySelectorAll('h2')].find(x=>x.textContent.trim()==='管理題目')?.closest('.panel')||document.querySelector('#addQuestionPanel')?.parentElement;if(!manager)return alert('新增題目功能尚未載入，請稍後再按一次。');const show=manager.style.display==='none';manager.style.display=show?'':'none';menu.querySelector('#simpleAddQuestion').textContent=show?'− 收起新增題目':'＋ 新增題目'};menu.querySelector('#simpleFilters').onclick=()=>{const filter=document.querySelector('#tagSearchPanel'),stars=document.querySelector('#questionStarFilters');if(!filter&&!stars)return alert('篩選功能尚未載入，請稍後再按一次。');const show=(filter?.style.display==='none'||filter?.classList.contains('hidden'));if(filter){filter.classList.remove('hidden');filter.style.display=show?'':'none'}if(stars)stars.style.display=show?'flex':'none';menu.querySelector('#simpleFilters').textContent=show?'− 收起篩選':'⚙ 篩選題目'}}const manager=[...document.querySelectorAll('h2')].find(x=>x.textContent.trim()==='管理題目')?.closest('.panel');if(manager&&!manager.dataset.simpleHidden){manager.dataset.simpleHidden='1';manager.style.display='none'}const filter=document.querySelector('#tagSearchPanel');if(filter&&!filter.dataset.simpleHidden){filter.dataset.simpleHidden='1';filter.classList.remove('hidden');filter.style.display='none'}const stars=document.querySelector('#questionStarFilters');if(stars&&!stars.dataset.simpleHidden){stars.dataset.simpleHidden='1';stars.style.display='none'}menu.parentElement!==hero.parentElement&&hero.insertAdjacentElement('afterend',menu)}
function applyVocabularyFixes(){renameVocabularySourceLabel();protectVocabularyTextSelection();renameVocabularyCollocations();addScriptSpeechDemo();enhanceRecallTraining();refreshScriptNoteDots();enhanceVocabularyStars();positionVocabularyStarsBesideTerm();addChineseMeaningToggle();labelVocabularyTagInputs();enhanceVocabularyTagFilters();enhanceQuestionStars();bindStableNoteToggle();if(guestMode)guestOpeningNote=true;lockGuestUI();if(guestMode)guestOpeningNote=false;ensureRecorderVisible();bindSavedAudioDiagnostics();if(guestMode)syncGuestHeader();hideWeeklyLearningBrief();addComponentNavigation();dedupeQuestionManagers();dedupeHomeFilters();hideLegacyHomeFilters();createSimpleHomeMenu();ensureTeacherSnapshotButton();showRecallBadges();bindSimpleAddQuestion();enforceCardDragging();openTeacherSnapshotFromHash()}
let bypassCloudRecords=false,homeLoadGeneration=0;const cloudAwareAll=all,cloudAwareHome=home;all=async function(){return bypassCloudRecords?recordCache:cloudAwareAll()};home=async function(){const generation=++homeLoadGeneration,task=cloudAwareHome(),watchdog=setTimeout(async()=>{if(generation!==homeLoadGeneration||!app.textContent.includes('正在讀取雲端紀錄'))return;console.warn('Home loading watchdog activated; rendering cached question bank.');bypassCloudRecords=true;try{await cloudAwareHome()}finally{bypassCloudRecords=false}},7000);try{return await task}finally{clearTimeout(watchdog)}}
let guestNoteCache=new Map();const openQuestionWithGuestCache=openQ;openQ=async function(id){await openQuestionWithGuestCache(id);if(guestMode&&!questionNote&&guestNoteCache.has(id)){questionNote=guestNoteCache.get(id)||'';noteVisible=false;renderPractice()}};
startGuestMode=async function(){if(currentUser||guestMode)return;guestMode=true;ownerLoginRequested=false;userRole='guest';role='student';learnerProfile=null;app.innerHTML='<div class="wrap"><div class="empty" style="margin-top:40px">正在載入訪客模式的題目、錄音與講稿…</div></div>';const[qResult,rResult,nResult]=await Promise.all([sb.from('questions').select('*').order('sort_order'),sb.from('responses').select('*').order('created_at',{ascending:false}),sb.from('question_notes').select('question_id,content,updated_at').order('updated_at',{ascending:false})]);const failures=[['題目',qResult.error],['錄音紀錄',rResult.error],['講稿',nResult.error]].filter(x=>x[1]);if(failures.length){app.innerHTML=`<div class="wrap"><div class="feedback" style="margin-top:30px"><b>訪客資料讀取權限尚未完整啟用</b><p>目前無法讀取：${failures.map(x=>esc(x[0])).join('、')}</p><p>${failures.map(x=>esc(x[1].message)).join('<br>')}</p><p>請由管理者在 Supabase SQL Editor 重新執行最新版 supabase-setup.sql 的「Guest read-only access」區段。</p></div></div>`;syncGuestHeader();return}Q=(qResult.data||[]).map(x=>({id:x.id,category:x.category,topic:x.topic,question:x.question,tags:(x.tags?.length?x.tags:[x.category,x.topic]).filter((v,i,a)=>v&&v!=='General'&&a.indexOf(v)===i),drillType:x.drill_type||'interview',practiceScript:x.practice_script||'',usageNotes:Array.isArray(x.usage_notes)?x.usage_notes:[],sortOrder:x.sort_order}));recordCache=(rResult.data||[]).map(x=>({id:x.id,questionId:x.question_id,createdAt:new Date(x.created_at).getTime(),audioUrl:'',audioPath:x.audio_path,duration:x.audio_duration,mastery:x.mastery,technical:x.technical_self_rating,english:x.english_self_rating,transcript:x.transcript||'',analysis:x.speech_analysis||null,comment:x.teacher_comment,teacherMastery:x.teacher_mastery,retry:x.retry_required}));guestNoteCache=new Map();(nResult.data||[]).forEach(x=>{if(!guestNoteCache.has(x.question_id)&&String(x.content||'').trim())guestNoteCache.set(x.question_id,x.content)});syncGuestHeader();await home()};
let featureObserver,featureTimer;const observeFeatures=()=>featureObserver.observe(document.body,{childList:true,subtree:true});featureObserver=new MutationObserver(()=>{clearTimeout(featureTimer);featureTimer=setTimeout(()=>{featureObserver.disconnect();try{applyVocabularyFixes()}catch(e){console.error('Feature enhancement error',e)}finally{observeFeatures()}},80)});observeFeatures();applyVocabularyFixes();
setTimeout(()=>{if(!currentUser&&!ownerLoginRequested&&!guestMode)startGuestMode()},0);
